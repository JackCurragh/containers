name: Build and publish container images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish, for example 1.0.0
        required: true
        default: 1.0.0

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iribo
            context: iribo
            image: translon-iribo
            tag: 1.0.0
          - name: orfquant
            context: orfquant
            image: translon-orfquant
            tag: 1.1.0-txdbmaker2
          - name: orfrater
            context: orfrater
            image: translon-orfrater
            tag: 1.0.0
          - name: translon-python
            context: translon-python
            image: translon-python
            tag: 1.0.0
          - name: riborf
            context: riborf
            image: translon-riborf
            tag: 1.0.0
          - name: ribotie
            context: ribotie
            file: Dockerfile
            image: translon-ribotie
            tag: 1.0.0
          - name: ribotie-cuda
            context: ribotie
            file: Dockerfile.cuda
            image: translon-ribotie-cuda
            tag: 1.0.0
          - name: gedi-price
            context: gedi-price
            image: translon-gedi-price
            tag: 1.0.0

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ matrix.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file || 'Dockerfile' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
